[package]
publish = false
name = "sylex_pipeline_v1"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
anyhow = { version = "1.0.102" }
sylex_upstream = { version = "0.1.0", path = "../upstream" }
sylex_catalogs = { version = "0.1.0", path = "../catalogs" }
sylex_semantics_v1 = { version = "0.1.0", path = "../semantics" }
# No `sylex_card`: nothing here speaks the engine's card type any more.
sylex_plugin_v1 = { version = "0.1.0", path = "../plugin" }
sylex_render_v1 = { version = "0.1.0", path = "../render" }
# Only for `sylex_core::plugin` — the path conventions, which the ADR keeps
# core-side. No card content in this crate is spelled in core terms.
sylex_core = { version = "0.1.0", path = "../core" }
rayon = "1"
regex = "1.12.3"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
sylex_lowering_v1 = { version = "0.1.0", path = "../lowering" }
tempfile = "3.27.0"
