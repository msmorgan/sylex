[package]
name = "sylex_lexicon"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
dpsi = { version = "0.1.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { workspace = true }
unicode-ident = "1"

[dev-dependencies]
proptest = "1.11.0"
clap = { version = "4.6.1", features = ["derive"] }
ron = "0.12.1"
serde_json = "1.0.150"
