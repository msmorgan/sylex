[package]
publish = false
name = "sylex_matchups"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Gates the matchup integration tests under tests/wc99.rs. The library and the
# cheap plugin-validity test always build, so the crate can't silently rot.
noncanon_tests = []

[dependencies]
sylex_card = { version = "0.1.0", path = "../card" }
sylex_core = { version = "0.1.0", path = "../core" }
sylex_engine = { version = "0.1.0", path = "../engine" }
sylex_plugin_v1 = { version = "0.1.0", path = "../plugin" }
