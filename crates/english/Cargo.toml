[package]
name = "sylex_english"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
sylex_upstream = { version = "0.1.0", path = "../upstream" }
sylex_lexicon = { version = "0.1.0", path = "../lexicon" }
sylex_vocabulary = { version = "0.1.0", path = "../vocabulary" }
sylex_syntax = { version = "0.1.0", path = "../syntax" }
dpsi = { version = "0.1.0", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
ron = "0.12.1"
sylex_syntax = { version = "0.1.0", path = "../syntax", features = ["tree-ranking-key"] }
