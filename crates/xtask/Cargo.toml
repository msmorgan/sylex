[package]
publish = false
name = "xtask"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0.102" }
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.2"
sylex_card = { version = "0.1.0", path = "../card" }
sylex_catalogs = { version = "0.1.0", path = "../catalogs" }
sylex_upstream = { version = "0.1.0", path = "../upstream" }
sylex_syl = { version = "0.1.0", path = "../syl" }
sylex_syntax = { version = "0.1.0", path = "../syntax" }
sylex_english = { version = "0.1.0", path = "../english" }
sylex_vocabulary = { version = "0.1.0", path = "../vocabulary" }
sylex_lexicon = { version = "0.1.0", path = "../lexicon" }
sylex_semantics_v1 = { version = "0.1.0", path = "../semantics" }
sylex_plugin_v1 = { version = "0.1.0", path = "../plugin" }
sylex_render_v1 = { version = "0.1.0", path = "../render" }
sylex_core = { version = "0.1.0", path = "../core" }
# Reuse the locked substring scanner for JSONL name candidates.
memchr = "2.8.2"
libc = "0.2.186"
sylex_pipeline_v1 = { version = "0.1.0", path = "../pipeline" }
macro_ron = { version = "0.1.0", path = "../macro_ron" }
# `map enums`: parse Rust sources to find `pub enum` shapes; span-locations
# lets `syn`'s spans report real source line numbers outside a proc-macro.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
rayon = "1"
regex = "1.12.3"
# `macro residuals --drafts` writes a `Vec<ConstructorFrames>` catalog file
# pretty-printed, which `ron::Options`'s own (compact) `to_string` cannot do.
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3.27.0"


