[workspace]
members = [
    ".",
    "crates/semantics",
    "crates/card",
    "crates/catalogs",
    "crates/english",
    "crates/lexicon",
    "crates/lexical_model",
    "crates/vocabulary",
    "crates/core",
    "crates/upstream",
    "crates/syl",
    "crates/engine",
    "crates/features",
    "crates/spelling",
    "crates/syntax",
    "crates/render",
    "crates/lowering",
    "crates/pipeline",
    "crates/matchups",
    "crates/plugin",
    "crates/tui",
    "crates/macro_ron",
    "crates/macro_ron_derive",
    "crates/macro_ron_lsp",
    "crates/xtask",
]
# Pinned once for the whole workspace; crates opt in with
# `thiserror = { workspace = true }`. Typed library errors derive their
# `Display`/`Error` impls from it — `anyhow` stays the binary-ish crates'
# error type and is versioned per crate as before.
[workspace.dependencies]
thiserror = "2.0.19"

# Strict linting for the whole workspace; crates opt in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every #[allow]/#[expect] must carry a `reason` — makes the stale-suppression
# rot class (see docs/tickets clippy-suppression-hygiene) unrepresentable going
# forward, since a reasonless suppression now warns.
allow_attributes_without_reason = "warn"

[package]
publish = false
name = "sylex"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
# `cargo run` from the workspace root launches the TUI via this bin.
default-run = "sylex"

[lints]
workspace = true

[dependencies]
sylex_tui = { version = "0.1.0", path = "crates/tui" }
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
slotmap = { version = "1.1.1", features = ["serde"] }

# `cargo xtask generate` streams the pinned Scryfall Oracle Cards JSONL; `extract`,
# `graduate`, and `validate` parse/serialize tens of thousands of RON card files
# (the latter through the `macro_ron` expander). Under an unoptimized dev build
# those parses take tens of seconds. Optimize the parsing crates — JSON
# (`serde_json`), RON (`ron`, `macro_ron`), and the regex engine (`regex` plus
# its `regex-automata`/`regex-syntax`/`aho-corasick`/`memchr` workhorses) — so
# the tools stay fast to *run* without a release build of the whole tree (the
# xtask alias uses the dev profile — see .cargo/config.toml). The regex crates
# carry `resolve`'s per-line parser registry and `extract`'s per-card matching;
# left unoptimized they were the dominant dev-only penalty (dev `resolve` ran
# ~5x slower than release). `sha2` and the snapshot/catalog crates carry corpus
# loading and identity hashing; `syn`/`proc-macro2`/`quote` carry the Rust
# source parsing and token emission the macro and `map` tooling run. Profile
# overrides only take effect from the workspace root manifest, which is why
# they live here.
[profile.dev.package.sylex_pipeline_v1]
opt-level = 2

# Optimize the v4 chart parser, packed forest, and round-trip verification.
[profile.dev.package.sylex_syntax]
opt-level = 2

[profile.dev.package.sylex_english]
opt-level = 2

[profile.dev.package.sylex_vocabulary]
opt-level = 2

[profile.dev.package.sylex_lexicon]
opt-level = 2

[profile.dev.package.xtask]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.ron]
opt-level = 2

[profile.dev.package.macro_ron]
opt-level = 2

[profile.dev.package.regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.aho-corasick]
opt-level = 2

[profile.dev.package.memchr]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.sylex_upstream]
opt-level = 2

[profile.dev.package.sylex_catalogs]
opt-level = 2

[profile.dev.package.syn]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 2

[profile.dev.package.quote]
opt-level = 2
