# Semantics workbench ported from Idris.
#
#   lake build Semantics           -- syntax, checker, templates and definitions (the inner loop)
#   lake build SemanticsCards      -- plus the printed-card bench
#   lake build                     -- plus the pin suites (the full gate; ./scripts/build adds --wfail)
name = "mtg"
version = "0.1.0"
defaultTargets = ["Semantics", "SemanticsCards", "SemanticsProofs"]

[leanOptions]
# Idris `%unbound_implicits off`: every implicit is written out.
autoImplicit = false

[[input_dir]]
name = "builtinBundle"
path = "../plugins_v3/builtin"
text = true

[[lean_lib]]
name = "Semantics"
extraDepTargets = ["builtinBundle"]
roots = ["Semantics", "Semantics.Check", "Semantics.Primitives", "Semantics.Definitions"]

[[lean_lib]]
name = "SemanticsCards"
roots = ["Semantics.Cards"]

[[lean_lib]]
name = "SemanticsProofs"
roots = ["Semantics.Proofs"]

