# Semantics workbench ported from Idris.
#
#   lake build Semantics            -- syntax, checker and templates (the inner loop)
#   lake build SemanticsDefinitions -- plus the builtin definitions and their checker proofs
#   lake build SemanticsCards      -- plus the printed-card bench
#   lake build                     -- plus the pin suites (the full gate; ./scripts/build adds --wfail)
name = "mtg"
version = "0.1.0"
defaultTargets = ["Semantics", "SemanticsDefinitions", "SemanticsCards", "SemanticsProofs"]

[leanOptions]
# Idris `%unbound_implicits off`: every implicit is written out.
autoImplicit = false

[[input_dir]]
name = "builtinBundle"
path = "../plugins_v3/builtin"
text = true

[[input_dir]]
name = "canonBundle"
path = "../plugins_v3/canon"
text = true

[[lean_lib]]
name = "Semantics"
roots = ["Semantics", "Semantics.Check", "Semantics.Primitives"]

[[lean_lib]]
name = "SemanticsDefinitions"
needs = ["builtinBundle"]
roots = ["Semantics.Definitions", "Semantics.Check.Builtin"]

[[lean_lib]]
name = "SemanticsCards"
needs = ["canonBundle"]
roots = ["Semantics.Cards"]

[[lean_lib]]
name = "SemanticsProofs"
roots = ["Semantics.Proofs"]

