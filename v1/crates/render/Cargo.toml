[package]
publish = false
name = "sylex_render_v1"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0.102" }
# The renderer reads SEMANTIC terms: they keep their `Expanded` invocation
# provenance, and so keep the rules-text templates that produce good prose.
# Lowered core is a compiled artifact and carries none
# (docs/decisions/semantics-spelling-lowering.md §12).
sylex_semantics_v1 = { version = "0.1.0", path = "../semantics" }
# The fidelity harness walks a loaded corpus; it needs the loader, not a second
# grammar. `sylex_core` arrives transitively through this and only through
# this — there is deliberately no direct dependency on it.
sylex_plugin_v1 = { version = "0.1.0", path = "../plugin" }
macro_ron = { version = "0.1.0", path = "../macro_ron" }
regex = "1.12.3"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
